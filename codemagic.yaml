workflows:
  android-release:
    name: LG TV Cast Android
    max_build_duration: 30
    environment:
      java: 17
      groups:
        - google_play
    scripts:
      - name: Build release APK
        script: |
          gradle --version
          gradle assembleRelease
    artifacts:
      - app/build/outputs/apk/release/app-release.apk
